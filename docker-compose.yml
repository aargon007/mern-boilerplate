services:
    server:
        build:
            context: .
            dockerfile: apps/server/Dockerfile
        restart: unless-stopped
        env_file: .env
        environment:
            NODE_ENV: production
            PORT: 5001
            DB_URI: ${DOCKER_DB_URI:-mongodb://mongo:27017/myapp}
            CLIENT_ORIGIN: ${DOCKER_CLIENT_ORIGIN:-http://localhost:4173}
        ports:
            - '5001:5001'
        depends_on:
            mongo:
                condition: service_healthy

    frontend:
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
            args:
                VITE_BASE_API: ${VITE_BASE_API:-/api/v1}
        restart: unless-stopped
        ports:
            - '4173:80'
        depends_on:
            - server

    mongo:
        image: mongo:8
        restart: unless-stopped
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    mongo-data:
